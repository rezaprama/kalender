name: Holiday source monitor

# Deterministic, read-only check of government sources. It never edits data;
# when something needs a curator it opens (or comments on) one issue.
on:
  schedule:
    - cron: '0 1 1 1,4,7,10 *' # quarterly, 08:00 WIB
    - cron: '0 1 20 9 *' # 20 September: next year's SKB is usually signed around now
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: monitor
        run: npx tsx scripts/monitor.ts --report monitor-report.md
      - name: Append data audit
        run: |
          echo "" >> monitor-report.md
          echo "## Data audit" >> monitor-report.md
          npx tsx scripts/audit.ts >> monitor-report.md 2>&1 || echo "**Audit reported a problem.**" >> monitor-report.md
      - name: Open or update the monitor issue
        if: steps.monitor.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh label create monitor --color C0262D --description "Holiday source monitor" --force
          existing=$(gh issue list --state open --label monitor --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file monitor-report.md
          else
            gh issue create --title "Holiday sources need review" --label monitor --body-file monitor-report.md
          fi
