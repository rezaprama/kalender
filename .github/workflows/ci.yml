name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build, typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check new commit attribution
        run: npm run check:attribution
        env:
          ATTRIBUTION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ATTRIBUTION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      # Build, typecheck, Biome lint, dataset validation, unit/integration/docs tests.
      - run: npm run check
      # Bundle exactly what Cloudflare would deploy (no credentials needed) and smoke-test it.
      - run: npm run smoke
      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps --only-shell chromium
      # Playwright journeys and axe-core WCAG 2.2 AA audit against the Node preview.
      - run: npm run e2e
