version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 is a rewritten compiler; adopt it in a deliberate, tested change.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types must not run ahead of the Node 22 runtime used by CI and engines.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
