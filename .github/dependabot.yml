version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 is a rewritten compiler; adopt it in a deliberate, tested change.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Types must not run ahead of the Node 22 runtime used by CI and engines.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      android-toolchain:
        patterns: ["com.android.application", "android", "jvm", "org.jetbrains.kotlin*"]
      androidx:
        patterns: ["androidx.*"]
    ignore:
      # AGP 9 requires a coordinated Gradle-wrapper / built-in-Kotlin migration.
      - dependency-name: com.android.application
        update-types: ["version-update:semver-major"]
      # Keep the Android, JVM, and Compose compiler family aligned. Patch updates remain enabled.
      - dependency-name: android
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: jvm
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: org.jetbrains.kotlin.plugin.compose
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # These Compose releases require compileSdk 37 and AGP 9.1+; the release baseline is SDK 36.
      - dependency-name: androidx.compose:compose-bom
        versions: [">=2026.08.00"]
      - dependency-name: androidx.core:core-ktx
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
